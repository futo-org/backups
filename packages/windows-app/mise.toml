[tools]
dotnet = "11.0.100"
"dotnet:NSwag.ConsoleCore" = "14.8.0"

[tasks."win:build"]
description = "Build the Windows app (debug) for this machine's architecture"
run = "dotnet build src/FutoBackups/FutoBackups.csproj -r win-{{arch(arm64='arm64', x64='x64')}} -p:Platform={{arch(arm64='ARM64', x64='x64')}}"

[tasks."win:api"]
description = "Regenerate the yucca-api client from the OpenAPI spec in packages/yucca-api-client"
run = "bash scripts/generate-api.sh"

[tasks."win:format"]
description = "Fix formatting and the analyzer findings dotnet format can fix; the build checks them"
run = "bash scripts/format.sh"

[tasks."win:test"]
description = "Run the Windows engine unit tests"
run = "dotnet test --project tests/FutoBackups.Core.Tests"

[tasks."win:check"]
description = "Build and test the Windows app"
run = [{ task = "win:build" }, { task = "win:test" }]

[tasks."win:mock"]
description = "Run the Windows app against simulated services, without an account"
depends = ["win:build"]
run = "src/FutoBackups/bin/{{arch(arm64='ARM64', x64='x64')}}/Debug/net11.0-windows10.0.26100.0/win-{{arch(arm64='arm64', x64='x64')}}/FutoBackups.exe --mock"
