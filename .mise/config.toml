monorepo_root = true

[monorepo]
config_roots = [
  "packages/common",
  "packages/docs",
  "packages/emails",
  "packages/futo-backups-bot",
  "packages/restic-proxy",
  "packages/standalone-app",
  "packages/web",
  "packages/yucca-admin-api",
  "packages/yucca-api",
  "packages/yucca-api-client",
  "packages/yucca-metrics-worker",
  "packages/yucca-sdk/orchestration-api",
  "packages/yucca-sdk/orchestration-ui",
]

[tools]
node = "26.12.1"
pnpm = "10.28.1"
wrangler = "4.127.0"
go = "1.27.3"
golangci-lint = "2.14.0"
restic = "0.19.1"

gh = "2.102.0"
"github:git-town/git-town" = "v24.1.0"

k3d = "5.9.0"
kubectl = "1.37.1"
helm = "4.3.0"
tilt = "0.37.8"

# Static validation of the k8s surface (mise run k8s:validate, used by CI).
# flux-local runs via `uvx` (see .mise/tasks/k8s/validate): uv auto-fetches a
# Python matching its requires-python, so the host's Python version (3.12 on
# GitHub runners, 3.14 on dev machines) doesn't matter.
kubeconform = "0.8.0"
kustomize = "5.8.2"            # flux-local shells out to it
flux2 = "2.9.5"                # ...and to the flux CLI
uv = "0.12.21"

[tasks.dev]
description = "Start all services in development mode"
depends = ["install:deps", "common:build", "docker:start"]
run = [
  { tasks = [
    "michael:dev",
    "//packages/restic-proxy:dev",
    "//packages/web:dev",
    "//packages/yucca-admin-api:dev",
    "//packages/yucca-api:dev",
    "//packages/yucca-metrics-worker:dev",
    "//packages/yucca-sdk/orchestration-api:dev",
    "//packages/yucca-sdk/orchestration-ui:dev",
  ] },
]

[tasks.build]
description = "Build all packages"
depends = ["*:build", "//packages/...:build"]

[tasks."common:build"]
description = "Build all common packages"
run = [{ task = "install:deps" }, { tasks = ["//packages/common:build", "//packages/emails:build"] }]

[tasks.test]
description = "Run all unit tests"
depends = ["*:test", "//packages/...:test"]

[tasks."test:integration"]
description = "Run all integration tests"
# NB: mise flags must precede the task pattern — anything after it is forwarded
# to the tasks themselves (jest/go test choke on a stray --jobs).
run = "mise run --jobs 1 '*:test:integration' ::: '//packages/...:test:integration'"

[tasks."test:e2e:web"]
description = "Run all web e2e tests"
run = [{ task = "test:e2e:wait" }, { task = "//packages/...:test:e2e:web" }]

[tasks."prepare"]
description = "Install and build packages"
run = [{ task = "install:frozen" }, { task = "build" }]

[tasks."check"]
description = "Run checks & unit tests"
run = [{ tasks = ["lint", "lint:go", "//packages/...:check"] }, { task = "format" }, { task = "test" }]

[tasks.fix]
description = "Run all possible code fixes"
run = [{ task = "*:fix" }, { task = "//packages/yucca-sdk/orchestration-ui:lingui" }]


[env]
NODE_ENV = "development"
LOG_LEVEL = "debug"

OTLP_METRICS_ENDPOINT = "localhost:8428"
OTLP_METRICS_URL_PATH = "/opentelemetry/v1/metrics"
OTLP_LOGS_ENDPOINT = "localhost:9428"
OTLP_LOGS_URL_PATH = "/insert/opentelemetry/v1/logs"
