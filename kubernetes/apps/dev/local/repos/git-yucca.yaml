---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: yucca
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/futo-org/backups
  ref:
    branch: main
  # Flux pulls only the GitOps manifests and the Helm charts they reference.
  ignore: |
    /*
    !/kubernetes
    !/charts
