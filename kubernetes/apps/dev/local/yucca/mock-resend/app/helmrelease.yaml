---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yucca-mock-resend
  namespace: yucca
spec:
  interval: 1h
  chart:
    spec:
      chart: charts/dev/mock-resend
      sourceRef:
        kind: GitRepository
        name: yucca
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # DEV ONLY. Prod leaves RESEND_API_URL at the real Resend API instead of
    # deploying this mock.
    fullnameOverride: yucca-mock-resend
    image:
      repository: ghcr.io/futo-org/backups/mock-resend
      tag: 0.0.1
