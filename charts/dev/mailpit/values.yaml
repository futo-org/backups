replicas: 1

# Stable in-cluster name, independent of the Helm release name (dev == prod).
# mock-resend delivers here; e2e assertions read the message API.
fullnameOverride: yucca-mailpit

image:
  repository: axllent/mailpit
  tag: v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
  pullPolicy: IfNotPresent

# 8025 serves both the web inbox and the REST API (SMTP on 1025 stays
# unexposed — delivery arrives over the HTTP send API).
ports:
  - name: http
    containerPort: 8025
    servicePort: 8025

service:
  type: ClusterIP

startupProbe:
  httpGet: { path: /readyz, port: http }
  periodSeconds: 2
  failureThreshold: 60
readinessProbe:
  httpGet: { path: /readyz, port: http }
  periodSeconds: 10
