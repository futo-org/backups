name: Release Please

on:
  workflow_dispatch: # For manual runs
  release: # To update release PRs when one is merged
    types: [published]
  pull_request: # To handle the release label being removed
    types: [unlabeled]
  push: # Standard workflow
    branches:
      - main

concurrency:
  group: release-please
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
    steps:
      # The App token is load-bearing: tags and releases minted with the
      # default GITHUB_TOKEN trigger no workflows (recursion guard), so the
      # Publish and Release Images workflows would never fire on a release.
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          token: ${{ steps.generate-token.outputs.token }}
