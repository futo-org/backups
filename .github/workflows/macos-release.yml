name: macOS Release

# Builds, signs, notarizes and publishes the macOS app for a release tag
#. The archive rides the versioned release; the Sparkle appcast rides
# a rolling prerelease `macos-appcast` that is never latest, so the
# feed URL is stable and the release list keeps showing real versions.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the macOS app for (e.g. v1.0.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: macos-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and publish the macOS app
    runs-on: macos-15
    timeout-minutes: 90
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this release needs a macOS build
        id: gate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=
          [ -n "$MACOS_CERTIFICATE_P12" ] || missing="$missing MACOS_CERTIFICATE_P12"
          [ -n "$MACOS_CERTIFICATE_PASSWORD" ] || missing="$missing MACOS_CERTIFICATE_PASSWORD"
          [ -n "$MACOS_SIGNING_IDENTITY" ] || missing="$missing MACOS_SIGNING_IDENTITY"
          [ -n "$APPLE_NOTARY_KEY_P8" ] || missing="$missing APPLE_NOTARY_KEY_P8"
          [ -n "$APPLE_NOTARY_KEY_ID" ] || missing="$missing APPLE_NOTARY_KEY_ID"
          [ -n "$APPLE_NOTARY_ISSUER" ] || missing="$missing APPLE_NOTARY_ISSUER"
          [ -n "$SPARKLE_PRIVATE_KEY" ] || missing="$missing SPARKLE_PRIVATE_KEY"
          [ -n "$SPARKLE_PUBLIC_KEY" ] || missing="$missing SPARKLE_PUBLIC_KEY"
          if [ -n "$missing" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS release is not configured; missing:${missing}"
            exit 0
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # A download failure just means no macos-appcast release exists yet,
          # i.e. this would be the first macOS release.
          if gh release download macos-appcast -p appcast.xml -D "$RUNNER_TEMP/feed"; then
            previous=$(sed -n 's:.*<sparkle:shortVersionString>\(.*\)</sparkle:shortVersionString>.*:\1:p' "$RUNNER_TEMP/feed/appcast.xml" | head -n 1)
            if [ -n "$previous" ] && git rev-parse -q --verify "refs/tags/v${previous}" >/dev/null &&
              git diff --quiet "v${previous}" "$TAG" -- packages/macos-app; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "::notice::packages/macos-app unchanged since v${previous}"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup Mise
        if: steps.gate.outputs.run == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # The action caches by default; a poisoned cache would end up in
          # the shipped binary, so a release build never restores one.
          cache: false

      - name: Import the signing certificate
        if: steps.gate.outputs.run == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without a partition list, codesign blocks on a keychain-access
          # prompt that nobody can answer on a headless runner.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          keychains=("$KEYCHAIN")
          while IFS= read -r entry; do
            if [ -n "$entry" ]; then keychains+=("$entry"); fi
          done < <(security list-keychains -d user | sed -e 's/^ *//' -e 's/"//g')
          security list-keychains -d user -s "${keychains[@]}"
          printf '%s' "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build, sign and notarize
        if: steps.gate.outputs.run == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name || inputs.tag }}/
          OUT_DIR: ${{ runner.temp }}/macos-release
        run: |
          set -euo pipefail
          mise run //packages/macos-app:mac:release "$VERSION"

      - name: Publish the archive and the appcast
        if: steps.gate.outputs.run == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          OUT_DIR: ${{ runner.temp }}/macos-release
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$OUT_DIR/FUTO-Backups-$VERSION.zip" --clobber
          gh release view macos-appcast >/dev/null 2>&1 ||
            gh release create macos-appcast --prerelease --latest=false --title "macOS update feed" --notes "Sparkle appcast for the FUTO Backups macOS app. Do not delete."
          gh release upload macos-appcast "$OUT_DIR/appcast.xml" --clobber

      - name: Remove the signing keychain and material
        if: always()
        run: |
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
