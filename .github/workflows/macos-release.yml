name: macOS Release

# Builds, signs, notarizes and publishes the macOS app for a release tag when its
# inputs changed since the feed's version. The archive rides its own
# `macos-v<version>` release; the Sparkle appcast rides a rolling prerelease
# `macos-appcast` that is never latest, so the feed URL is stable and the
# release list keeps showing real versions.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the macOS app for (e.g. v1.0.0)
        required: true
        type: string

permissions: {}

concurrency:
  # One global group so two releases can never publish the shared appcast concurrently.
  group: macos-release
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether this release needs a macOS build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decision.outputs.run }}
      version: ${{ steps.decision.outputs.version }}
      previous: ${{ steps.decision.outputs.previous }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release against the macOS inputs
        id: decision
        env:
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version_cmp() {
            local IFS=.
            local -a a b
            read -ra a <<< "$1"
            read -ra b <<< "$2"
            [ "${#a[@]}" -eq 3 ] && [ "${#b[@]}" -eq 3 ] || return 2
            local i
            for i in 0 1 2; do
              case "${a[$i]}" in '' | *[!0-9]*) return 2 ;; esac
              case "${b[$i]}" in '' | *[!0-9]*) return 2 ;; esac
            done
            for i in 0 1 2; do
              if [ "${a[$i]}" -lt "${b[$i]}" ]; then printf '%s\n' -1; return; fi
              if [ "${a[$i]}" -gt "${b[$i]}" ]; then printf '%s\n' 1; return; fi
            done
            printf '%s\n' 0
          }
          restic_image() {
            git show "$1:packages/standalone-app/Dockerfile" | sed -n 's/^ARG RESTIC_IMAGE=//p'
          }
          version=${TAG#v}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is not a plain MAJOR.MINOR.PATCH release tag"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            prerelease=$EVENT_PRERELEASE
          else
            prerelease=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
          fi
          if [ "$prerelease" = true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is a prerelease"
            exit 0
          fi
          if gh release view "macos-v$version" > /dev/null 2>&1; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macos-v$version is already published"
            exit 0
          fi
          previous=
          # A download failure just means no macos-appcast release exists yet,
          # i.e. this would be the first macOS release.
          if gh release download macos-appcast -p appcast.xml -D "$RUNNER_TEMP/feed"; then
            previous=$(sed -n 's|.*<sparkle:shortVersionString>\([^<]*\)</sparkle:shortVersionString>.*|\1|p' "$RUNNER_TEMP/feed/appcast.xml" | head -n 1)
            if [ -n "$previous" ] && cmp=$(version_cmp "$previous" "$version"); then
              if [ "$cmp" -eq 0 ]; then
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "::notice::v$version is already published"
                exit 0
              fi
              if [ "$cmp" -eq 1 ]; then
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "::notice::a newer version (v$previous) is already published"
                exit 0
              fi
              if git rev-parse -q --verify "refs/tags/v$previous" > /dev/null &&
                git diff --quiet "v$previous" "$TAG" -- packages/macos-app packages/restic-proxy .mise/config.toml &&
                [ "$(restic_image "v$previous")" = "$(restic_image "$TAG")" ]; then
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "::notice::macOS app inputs unchanged since v$previous"
                exit 0
              fi
            fi
          fi
          printf 'run=true\nversion=%s\nprevious=%s\n' "$version" "$previous" >> "$GITHUB_OUTPUT"

  release:
    name: Build, notarize and publish the macOS app
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    # Infisical syncs the apple-signing/global/ci and yucca/global/ci secrets
    # here only; the environment admits main and the v* tags.
    environment: macos-release
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_APPLICATION__IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION__IDENTITY }}
          APPLE_DEVELOPER_ID_APPLICATION__P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION__P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION__P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION__P12_PASSWORD }}
          APPLE_NOTARY_API_KEY__KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY__KEY_ID }}
          APPLE_NOTARY_API_KEY__ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_KEY__ISSUER_ID }}
          APPLE_NOTARY_API_KEY__P8: ${{ secrets.APPLE_NOTARY_API_KEY__P8 }}
          MACOS_SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=
          for name in APPLE_TEAM_ID APPLE_DEVELOPER_ID_APPLICATION__IDENTITY APPLE_DEVELOPER_ID_APPLICATION__P12_BASE64 \
            APPLE_DEVELOPER_ID_APPLICATION__P12_PASSWORD APPLE_NOTARY_API_KEY__KEY_ID APPLE_NOTARY_API_KEY__ISSUER_ID \
            APPLE_NOTARY_API_KEY__P8 MACOS_SPARKLE_PRIVATE_KEY; do
            case "${!name}" in '' | REPLACE_ME) missing="$missing $name" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "::error::the macos-release environment is missing:${missing}"
            exit 1
          fi

      - name: Checkout release tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Point the build at the runner's selected Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Generate release notes filtered to the Mac app
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          PREVIOUS: ${{ needs.gate.outputs.previous }}
        run: |
          set -euo pipefail
          notes="$GITHUB_WORKSPACE/packages/macos-app/scripts/release-notes.sh"
          if [ -n "$PREVIOUS" ] && git rev-parse -q --verify "refs/tags/v$PREVIOUS" > /dev/null; then
            "$notes" markdown "$TAG" "v$PREVIOUS" > "$RUNNER_TEMP/macos-notes.md"
            "$notes" html "$TAG" "v$PREVIOUS" > "$RUNNER_TEMP/macos-notes.html"
          else
            "$notes" markdown "$TAG" > "$RUNNER_TEMP/macos-notes.md"
            "$notes" html "$TAG" > "$RUNNER_TEMP/macos-notes.html"
          fi
          printf '\nBuilt from v%s.\n' "$VERSION" >> "$RUNNER_TEMP/macos-notes.md"

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # The action caches by default; a poisoned cache would end up in
          # the shipped binary, so a release build never restores one.
          cache: false

      - name: Import the signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION__P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION__P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY__P8 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without a partition list, codesign blocks on a keychain-access
          # prompt that nobody can answer on a headless runner.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          keychains=("$KEYCHAIN")
          while IFS= read -r entry; do
            if [ -n "$entry" ]; then keychains+=("$entry"); fi
          done < <(security list-keychains -d user | sed -e 's/^ *//' -e 's/"//g')
          security list-keychains -d user -s "${keychains[@]}"
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"

      - name: Build, sign and notarize
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION__IDENTITY }}
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY__KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_API_KEY__ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_PRIVATE_KEY }}
          DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/macos-v${{ needs.gate.outputs.version }}/
          RELEASE_NOTES_HTML_FILE: ${{ runner.temp }}/macos-notes.html
          OUT_DIR: ${{ runner.temp }}/macos-release
        run: |
          set -euo pipefail
          mise run //packages/macos-app:mac:release "$VERSION"

      - name: Publish the archive and the appcast
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          OUT_DIR: ${{ runner.temp }}/macos-release
        run: |
          set -euo pipefail
          version_cmp() {
            local IFS=.
            local -a a b
            read -ra a <<< "$1"
            read -ra b <<< "$2"
            [ "${#a[@]}" -eq 3 ] && [ "${#b[@]}" -eq 3 ] || return 2
            local i
            for i in 0 1 2; do
              case "${a[$i]}" in '' | *[!0-9]*) return 2 ;; esac
              case "${b[$i]}" in '' | *[!0-9]*) return 2 ;; esac
            done
            for i in 0 1 2; do
              if [ "${a[$i]}" -lt "${b[$i]}" ]; then printf '%s\n' -1; return; fi
              if [ "${a[$i]}" -gt "${b[$i]}" ]; then printf '%s\n' 1; return; fi
            done
            printf '%s\n' 0
          }
          if gh release view "macos-v$VERSION" > /dev/null 2>&1; then
            echo "::error::macos-v$VERSION already exists; delete it to re-publish"
            exit 1
          fi
          gh release create "macos-v$VERSION" "$OUT_DIR/FUTO-Backups-$VERSION.zip" \
            --target "$(git rev-parse "refs/tags/$TAG^{commit}")" \
            --title "FUTO Backups for macOS $VERSION" \
            --notes-file "$RUNNER_TEMP/macos-notes.md" \
            --latest=false
          gh release view macos-appcast >/dev/null 2>&1 ||
            gh release create macos-appcast --prerelease --latest=false --title "macOS update feed" --notes "Sparkle appcast for the FUTO Backups macOS app. Do not delete."
          # A published zip is never replaced, so a feed that already advertises
          # this version or a newer one must not move backwards.
          if gh release download macos-appcast -p appcast.xml -D "$RUNNER_TEMP/current"; then
            published=$(sed -n 's|.*<sparkle:shortVersionString>\([^<]*\)</sparkle:shortVersionString>.*|\1|p' "$RUNNER_TEMP/current/appcast.xml" | head -n 1)
            if [ -n "$published" ] && cmp=$(version_cmp "$published" "$VERSION") && [ "$cmp" -ge 0 ]; then
              echo "::notice::the feed already advertises v$published; leaving it unchanged"
              exit 0
            fi
          fi
          gh release upload macos-appcast "$OUT_DIR/appcast.xml" --clobber

      - name: Remove the signing keychain and material
        if: always()
        run: |
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
