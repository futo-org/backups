name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # zizmor cache-poisoning: never restore a shared cache in a job that
          # publishes packages.
          cache: false
      - run: mise run prepare

      - name: Publish
        run: |
          pnpm -r \
            --filter @futo-org/backups-api-client \
            --filter @futo-org/backups-orchestrator-api \
            --filter @futo-org/backups-orchestrator-ui \
            publish --access public --provenance --no-git-checks

  docker:
    name: Publish standalone image
    uses: immich-app/devtools/.github/workflows/multi-runner-build.yml@f14fed578c121152a8f9e391b569afca20e32e6f # multi-runner-build-workflow-v4.1.0
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      image: backups/standalone
      context: .
      dockerfile: packages/standalone-app/Dockerfile
      # multi-runner-build v4 takes its tags explicitly; these are the rules v3
      # generated (semver release tags, :release for full releases).
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=sha,format=long,prefix=commit-
        type=semver,pattern={{version}},prefix=v
        type=semver,pattern={{major}},prefix=v
        type=match,pattern=v(\d+),group=1,prefix=v,suffix=-rc,enable=${{ github.event.release.prerelease == true }}
        type=raw,value=release,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

  docker-restic-proxy:
    name: Publish restic-proxy image
    uses: immich-app/devtools/.github/workflows/multi-runner-build.yml@f14fed578c121152a8f9e391b569afca20e32e6f # multi-runner-build-workflow-v4.1.0
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      image: backups/restic-proxy
      context: .
      dockerfile: packages/restic-proxy/Dockerfile
      # multi-runner-build v4 takes its tags explicitly; these are the rules v3
      # generated (semver release tags, :release for full releases).
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=sha,format=long,prefix=commit-
        type=semver,pattern={{version}},prefix=v
        type=semver,pattern={{major}},prefix=v
        type=match,pattern=v(\d+),group=1,prefix=v,suffix=-rc,enable=${{ github.event.release.prerelease == true }}
        type=raw,value=release,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
