name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  # Queue every run FIFO instead of coalescing pending ones; BUILD_TAG stays monotonic.
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/futo-org/backups
  # Monotonic monorepo build tag (every app ships together). Deployments that
  # track main pick the highest 0.0.<n> chart from GHCR, so CI never needs
  # cluster access.
  BUILD_TAG: 0.0.${{ github.run_number }}

jobs:
  # A migration that sorts before one already executed makes every yucca-api /
  # yucca-admin-api pod crashloop at boot (Kysely refuses the whole set), and
  # the stale-branch case escapes PR CI: checks don't re-run when main moves
  # (incident: #492 merged after #510's re-date). Gate the build on HEAD^ so a
  # bad merge stops here instead of rolling out.
  migration-order:
    name: Migration ordering gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Delivery is main-only: a workflow_dispatch on any other ref would
      # build and tag images from an unmerged tree. Fail instead of skip so
      # a branch dispatch cannot conclude green as a silent no-op; every
      # later job needs this one, so the refusal cascades.
      - name: Refuse non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy delivers main only, not ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: packages/yucca-api/.mise/tasks/check-migration-order HEAD^

  # == Build + push every app image (the ONLY delivery action CI performs) ==
  # Release commits build like any other. v<version> image tags are published
  # by the release-images workflow on the release event, decoupled from this
  # workflow's queue.
  build:
    name: Build ${{ matrix.app.image }}
    needs: migration-order
    runs-on: ubuntu-latest
    # A hung build would hold the group's single running slot and stall every
    # queued run behind it; fail fast instead of the default 360m.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - { package: yucca-api, image: api }
          - { package: yucca-admin-api, image: admin-api }
          - { package: yucca-metrics-worker, image: metrics-worker }
          - { package: futo-backups-bot, image: bot }
          - { package: web, image: web }
          - { package: michael, image: michael }
          - { package: columbo, image: columbo }
          - { package: support-logs-streamer, image: support-logs-streamer }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.app.package == 'columbo' && '0' || '1' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: packages/${{ matrix.app.package }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.image }}:${{ env.BUILD_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.image }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.app.image }}:main
          cache-from: type=gha,scope=${{ matrix.app.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.package }}

  # Charts go out only once every image they point at exists, so a chart
  # version is always deployable.
  charts:
    name: Publish charts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Package and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          mise run charts:package "$BUILD_TAG" "$BUILD_TAG" dist/charts
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          for chart in dist/charts/*.tgz; do
            helm push "$chart" "oci://${IMAGE_PREFIX}/charts"
          done
